# Maps Gazebo transport topics <-> ROS 2 topics.
# This file is the seam between "the simulator" and "your robot code".
# Point your nodes at the ROS side and they will run unchanged on the real sub.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/sub/odom"
  gz_topic_name: "/model/sub/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Sensors. Named like the real drivers will name them, so state estimation
# and control never know whether they are talking to Gazebo or hardware.
- ros_topic_name: "/imu/data_raw"
  gz_topic_name: "/sub/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Raw altimeter; depth_sensor converts it to /depth (metres, positive down).
- ros_topic_name: "/altimeter"
  gz_topic_name: "/sub/altimeter"
  ros_type_name: "ros_gz_interfaces/msg/Altimeter"
  gz_type_name: "gz.msgs.Altimeter"
  direction: GZ_TO_ROS

- ros_topic_name: "/sub/camera/image_raw"
  gz_topic_name: "/sub/camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# IDs 0=FR, 1=FL, 2=BR, 3=BL, 4=RD, 5=LD.
# Topic IDs follow THRUSTER_TOPIC_IDS; actuator_commands applies the profile.

- ros_topic_name: "/sim/thrust/t0"
  gz_topic_name: "/model/sub/joint/thr_0_joint/cmd_thrust"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

