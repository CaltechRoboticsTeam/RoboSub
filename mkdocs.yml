site_name: RoboSub Software and Documentation Hub
site_description: Software documentation for the RoboSub team
site_url: https://crt.robosub.io/

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - General tools:
      - AI: general-tools/AI.md
      - Git: general-tools/git.md

  - Software:
      - Setup: software/setup.md
      - Robot startup and tuning: software/runtime.md
      - Xbox controller: software/gamepad.md
      - Current-sub field tests: software/field-testing.md
      - Teensy USB bridge: software/teensy-usb.md
      - Vehicle profiles and M5 commands: software/thrusters.md
      - Future T200 thrusters and PWM: software/thrusters-t200.md
      - Underwater vision: software/vision.md
      - CVAT labeling: software/cvat.md

  - Mechanical:
      - Solidworks Setup:
          - Windows: mechanical/solidworks-setup/windows.md
          - Mac / Linux: mechanical/solidworks-setup/mac-linux.md
      - O Ring Design Guide: mechanical/O-ring Groove Design.md
  - Firmware:
      - Hydrophone: firmware/HydrophoneBoard.md
      - Pressure Transducer: firmware/PressureTransducerBoard.md
    

  - Guidelines:
      - guidelines.md
      
strict: true
